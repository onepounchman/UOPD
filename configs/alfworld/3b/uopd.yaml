project: UOPD
name: alfworld_3b_uopd
checkpoint_root_dir: ${oc.env:UOPD_OUTPUT_DIR}/checkpoints
continue_from_checkpoint: false
algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6
    lr_warmup_steps_ratio: 0.0
  policy_loss_fn: uopd
  policy_loss_fn_args:
    loss_agg_mode: token-mean
    sft_coef: 1.0
    sft_mode: plain
model:
  model_path: Qwen/Qwen2.5-3B-Instruct
  max_prompt_tokens: 2048
  max_response_tokens: 512
cluster:
  node_num: 1
  gpu_per_node: 8
buffer:
  total_steps: 250
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: ${oc.env:UOPD_DATA_DIR}/alfworld/train.jsonl
      split: train
      format:
        prompt_key: game_file
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        max_env_steps: 50
        detect_uq: confidence
        detect_uq_seed: 0
        tau: 1.28
        detect_temperature: 1.0
        trigger_cap: null
        sft_warmup_steps: 0
        cold_start_takeover: false
        tau_mode: quantile
        rate_schedule: linear
        r_start: 0.3
        r_end: 0.05
        r_decay_steps: 120
        window_size: 1000
        window_n_min: 300
        teacher_sched: pipeline
        teacher_takeover: true
        temperature: 1.0
      task_selector:
        selector_type: random
        seed: 42
    default_workflow_type: UOPD_alfworld_workflow
    default_eval_workflow_type: eval_alfworld_workflow
  trainer_input:
    experience_buffer:
      name: alfworld_3b_uopd_buffer
      storage_type: queue
      path: sqlite:///${oc.env:UOPD_OUTPUT_DIR}/buffer.db
explorer:
  eval_interval: 5
  runner_per_model: 8
  max_timeout: 3600
  rollout_model:
    engine_num: 2
    tensor_parallel_size: 2
    enable_prefix_caching: true
    enforce_eager: false
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
  - model_path: langfeng01/GiGPO-Qwen2.5-7B-Instruct-ALFWorld
    engine_num: 1
    tensor_parallel_size: 2
    enable_prefix_caching: true
    enforce_eager: false
    dtype: bfloat16
    seed: 42
    max_model_len: 20480
    max_prompt_tokens: 16384
    max_response_tokens: 512
  env_vars:
    PYTHONPATH: ${oc.env:PYTHONPATH}
    ALFWORLD_DATA: ${oc.env:ALFWORLD_DATA}
    TOKENIZERS_PARALLELISM: 'false'
  eval_on_startup: false
synchronizer:
  sync_method: nccl
  sync_style: dynamic_by_explorer
  sync_interval: 1
  sync_timeout: 3600
trainer:
  total_steps: 250
  save_interval: 250
  grad_clip: 1.0
  use_dynamic_bsz: true
  max_token_len_per_gpu: 16384
  ulysses_sequence_parallel_size: 2
  save_hf_checkpoint: always
monitor:
  monitor_type: tensorboard
