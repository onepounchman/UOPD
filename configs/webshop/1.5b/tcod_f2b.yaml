project: UOPD
name: webshop_1.5b_tcod_f2b
checkpoint_root_dir: ${oc.env:UOPD_OUTPUT_DIR}/checkpoints
continue_from_checkpoint: false
algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6
  policy_loss_fn: ppo
model:
  model_path: Qwen/Qwen2.5-1.5B-Instruct
  max_prompt_tokens: 4096
  max_response_tokens: 512
cluster:
  node_num: 1
  gpu_per_node: 8
buffer:
  total_steps: 150
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: webshop
      storage_type: file
      path: ${oc.env:UOPD_DATA_DIR}/webshop/train.jsonl
      split: train
      format:
        prompt_key: task_id
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        temperature: 1.0
        max_env_steps: 15
        total_steps: 150
        checkpoint_strategy: linear
        checkpoint_steps: 4
      task_selector:
        selector_type: sequential
        seed: 42
    eval_tasksets:
    - name: webshop_eval
      storage_type: file
      path: ${oc.env:UOPD_DATA_DIR}/webshop/test_pool.jsonl
      split: test
      total_steps: 10
      task_selector:
        selector_type: random
        seed: 42
      format:
        prompt_key: task_id
      rollout_args:
        temperature: 0.4
        logprobs: 0
      workflow_args:
        max_env_steps: 15
    default_workflow_type: TCOD_f2b_webshop_workflow
    default_eval_workflow_type: eval_webshop_workflow
  trainer_input:
    experience_buffer:
      name: webshop_1.5b_tcod_f2b_buffer
      storage_type: queue
      path: sqlite:///${oc.env:UOPD_OUTPUT_DIR}/buffer.db
explorer:
  eval_interval: 5
  runner_per_model: 8
  max_timeout: 3600
  rollout_model:
    engine_num: 2
    tensor_parallel_size: 2
    enable_prefix_caching: true
    enforce_eager: false
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
  - model_path: langfeng01/GiGPO-Qwen2.5-7B-Instruct-WebShop
    engine_num: 1
    tensor_parallel_size: 2
    enable_prefix_caching: true
    enforce_eager: false
    dtype: bfloat16
    seed: 42
    max_model_len: 20480
    max_prompt_tokens: 16384
    max_response_tokens: 512
  env_vars:
    PYTHONPATH: ${oc.env:PYTHONPATH}
    ALFWORLD_DATA: ${oc.env:ALFWORLD_DATA}
    TOKENIZERS_PARALLELISM: 'false'
synchronizer:
  sync_method: nccl
  sync_style: dynamic_by_explorer
  sync_interval: 1
  sync_timeout: 3600
trainer:
  total_steps: 150
  save_interval: 50
  grad_clip: 1.0
  use_dynamic_bsz: true
  max_token_len_per_gpu: 16384
  ulysses_sequence_parallel_size: 2
  save_hf_checkpoint: always
monitor:
  monitor_type: tensorboard
